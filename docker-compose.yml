# Local development stack. Spec §3: networks `edge` (reverse proxy + api, not built here - this dev
# compose publishes api's port directly to the host instead) and `backend` (internal only: api,
# coordinator, postgres, migrator). Full production hardening (Docker secrets, fixed KnownProxies
# addresses, an `ops` profile, read-only root filesystems beyond what's already in the Dockerfiles) is
# deferred - see docs/TRACEABILITY.md phase 6 notes for the exact list of what's real vs. dev-shortcut here.
services:
  postgres:
    image: postgres:18
    container_name: zaagl-postgres
    environment:
      POSTGRES_DB: zaagl
      POSTGRES_USER: zaagl
      POSTGRES_PASSWORD: zaagl_dev
    ports:
      - "5433:5432" # host-side remap only; containers reach it at postgres:5432 (see note in README)
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/init-db:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zaagl -d zaagl"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8
    container_name: zaagl-valkey
    ports:
      - "6379:6379"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot, runs as root: makes sure the named volumes are owned by the services' uid/gid 10001. A volume first created
  # by another image or an older build keeps its old owner, and the non-root coordinator then could not write
  # /state/hwm.json (leases answered 503). It only changes ownership when the top-level owner differs and never
  # removes or recreates a volume. Reuses the coordinator image (no extra pull).
  volume-init:
    build:
      context: .
      dockerfile: src/Zaagl.Coordinator/Dockerfile
    container_name: zaagl-volume-init
    user: "0:0"
    entrypoint:
      - sh
      - -c
      - |
        mkdir -p /state/allocator-sink /srv/zaagl/storage
        # /state is tiny: fix it whenever anything inside is not owned by 10001 (e.g. a hwm.json written as another uid).
        if [ -n "$$(find /state ! -uid 10001 -print -quit)" ]; then chown -R 10001:10001 /state; fi
        # The object store can be large: only the mount root is checked (new files are always written as 10001).
        [ "$$(stat -c %u:%g /srv/zaagl/storage)" = "10001:10001" ] || chown -R 10001:10001 /srv/zaagl/storage
    volumes:
      - coordstate:/state
      - storage:/srv/zaagl/storage
    networks:
      - backend
    restart: "no"

  # Spec §3 `migrator`: one-shot, applies every module's EF Core migrations, exits 0. Not run by default;
  # `docker compose run --rm migrator` (or it runs automatically via `depends_on: condition:
  # service_completed_successfully` on api/coordinator below).
  migrator:
    build:
      context: .
      dockerfile: src/Zaagl.Api/Dockerfile
    container_name: zaagl-migrator
    entrypoint: ["dotnet", "Zaagl.Api.dll", "migrate"]
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=zaagl;Username=zaagl;Password=zaagl_dev"
      ConnectionStrings__Valkey: "valkey:6379,abortConnect=false"
      Jwt__Key: "dev-only-signing-key-change-me-0123456789abcdef"
      ASPNETCORE_ENVIRONMENT: "Development" # Production requires Access:GrantKeys; dev uses an ephemeral key
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    restart: "no"

  coordinator:
    build:
      context: .
      dockerfile: src/Zaagl.Coordinator/Dockerfile
    container_name: zaagl-coordinator
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=zaagl;Username=zaagl;Password=zaagl_dev"
      Coordinator__Token: "dev-coordinator-token"
      Coordinator__AdminToken: "dev-coordinator-admin-token"
      Coordinator__StateFilePath: "/state/hwm.json"
      Allocator__Sink__Type: "LocalFileSystem"
      Allocator__Sink__LocalFileSystem__Directory: "/state/allocator-sink"
      Allocator__RequireArchiveConfirmation: "false" # dev Postgres has no WAL archiving configured; see docs/TRACEABILITY.md
    ports:
      - "5085:8080" # spec: backend-network-only in production; published here so this dev host can reach it directly
    volumes:
      - coordstate:/state
    depends_on:
      migrator:
        condition: service_completed_successfully
      volume-init:
        condition: service_completed_successfully
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/Zaagl.Api/Dockerfile
    container_name: zaagl-api
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=zaagl;Username=zaagl;Password=zaagl_dev"
      ConnectionStrings__Valkey: "valkey:6379,abortConnect=false"
      Jwt__Key: "dev-only-signing-key-change-me-0123456789abcdef"
      # DEV KEY NOTE: this value MUST match the key fingerprint already stored in the coordinator DB
      # (coordinator `key_fingerprint`; checked on every lease). A mismatch makes /health/issuer report
      # KeyMismatch and POST /api/links return 503 (docs/TRACEABILITY.md). The live dev DB currently does NOT
      # match this value; it was deliberately left unchanged. Fix by setting the key that produced the stored
      # fingerprint (never by editing the DB), or by recreating the dev DB on purpose. Override without editing
      # this file: ZAAGL_SCRAMBLE_KEY=... docker compose up -d api
      ShortLinks__ScrambleKey: "${ZAAGL_SCRAMBLE_KEY:-dev-only-scramble-key-change-me-0123456789abcdef}"
      GUEST_KEY: "dev-only-guest-key-change-me-0123456789abcdef"
      Coordinator__BaseUrl: "http://coordinator:8080"
      Coordinator__Token: "dev-coordinator-token"
      ASPNETCORE_ENVIRONMENT: "Development"
      # Same filesystem as the worker (Files module, one volume so temp -> objects is an atomic rename).
      Storage__Root: "/srv/zaagl/storage"
      # E1.2/E1.3 dev (OPS-009/OPS-012). NOTE: the backend options classes for these keys are not in the
      # tree yet (only Storage:Root/InternalPathPrefix exist); names follow DEVOPS_PLAN section 2.4 and must be
      # confirmed by backend (BE-012/BE-014). Unbound keys are ignored by ASP.NET configuration.
      ClamAv__Host: "clamav"
      ClamAv__Port: "3310"
      ClamAv__FailClosed: "true" # clamd down/timeout/error => file stays unscanned, never served (S-02)
      ClamAv__ScanByPath: "true" # clamd mounts storage read-only at the same path
      Storage__Admission__MinFreeBytes: "${ZAAGL_MIN_FREE_BYTES:-1073741824}"  # 1 GiB floor in dev; prod uses percent
      Storage__Admission__SafetyPercent: "5"                                    # DEVOPS_PLAN 2.4(1)
      Storage__Admission__SoftClosePercent: "80"                                # new sessions capped at 100 MB
      Storage__Admission__RefuseNewPercent: "90"                                # refuse all new file sessions (507)
      Storage__Admission__RetryAfterSeconds: "300"
      Storage__TempMaxAgeHours: "24"                                            # tus partial janitor, 2.4(3)
      # Dev delivery: usercontent.localhost resolves to 127.0.0.1 in browsers; the API itself answers /d/<ticket>
      # (Hosts:RewriteDeliveryPath=true in appsettings.Development.json), so no Nginx is run in dev.
    ports:
      - "5084:8080" # spec: edge-network-only, port not published in production; published here for dev access
    volumes:
      - storage:/srv/zaagl/storage
    depends_on:
      migrator:
        condition: service_completed_successfully
      volume-init:
        condition: service_completed_successfully
      coordinator:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ARC-012 / BE-013: background job runner (files.tasks). Backend network only, no port, no DNS name. Its own
  # small Postgres pool (Jobs:MaxPoolSize 10) so job bursts never take the api's redirect connections.
  worker:
    build:
      context: .
      dockerfile: src/Zaagl.Worker/Dockerfile
    container_name: zaagl-worker
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=zaagl;Username=zaagl;Password=zaagl_dev"
      Jobs__MaxPoolSize: "10"
      # Must be the same filesystem the api uses (appsettings.json "Storage"): both mount the `storage` volume.
      Storage__Root: "/srv/zaagl/storage"
      Worker__LivenessFile: "/tmp/zaagl-worker-alive"
      DOTNET_ENVIRONMENT: "Development"
      # Same ClamAV / admission keys as the api (see the comment there; key names pending backend confirmation).
      ClamAv__Host: "clamav"
      ClamAv__Port: "3310"
      ClamAv__FailClosed: "true"
      ClamAv__ScanByPath: "true"
      Storage__TempMaxAgeHours: "24"
    volumes:
      - storage:/srv/zaagl/storage
    depends_on:
      migrator:
        condition: service_completed_successfully
      volume-init:
        condition: service_completed_successfully
    networks:
      - backend
    restart: unless-stopped
    # Host.ShutdownTimeout is 60 s (Program.cs), Jobs:Files:ShutdownGraceSeconds 55: give it that before SIGKILL.
    stop_grace_period: 65s
    # ARC-012 §5 proposes 6g / 4 CPUs on the 12-16 vCPU production host. CPU limit left out here because
    # `cpus: 4` is rejected on a dev host with fewer cores.
    mem_limit: 6g
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/zaagl-worker-alive -mmin -1 | grep -q . || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s

  # OPS-009 (dev minimum): clamd on the backend network only, TCP 3310, NO published port. Scans by path, so
  # it mounts the `storage` volume READ-ONLY at the same path as api/worker. Signatures live in its own new
  # volume `clamav-db` (survives restarts, so the ~300 MB download happens once).
  # Slow-download escape hatch: CLAMAV_NO_FRESHCLAMD=true skips the freshclam updater daemon. clamd still needs
  # a signature DB to start; with an empty `clamav-db` the entrypoint downloads once regardless. With
  # fail-closed scanning, an unready clamd means uploads stay unscanned (that is the intended behaviour).
  # Start period is long because first boot downloads signatures [EST 1-5 min; not measured, no Docker here].
  # Permissions: clamd runs as user `clamav`; objects are 0640 zaagl:zaagl (10001). If scans get "Permission
  # denied" in dev, add `group_add: ["10001"]` and make files group-readable (prod design: DEVOPS_PLAN 2.2).
  clamav:
    image: clamav/clamav:1.4
    container_name: zaagl-clamav
    environment:
      CLAMAV_NO_FRESHCLAMD: "${CLAMAV_NO_FRESHCLAMD:-false}"
      CLAMAV_NO_MILTERD: "true"
    volumes:
      - clamav-db:/var/lib/clamav
      - storage:/srv/zaagl/storage:ro
    networks:
      - backend
    restart: unless-stopped
    mem_limit: 3g # signature DB is loaded into RAM [EST ~1.5-2 GB]
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  # Spec §3: catches outgoing email in development (dev only - never started in a production compose).
  mailpit:
    image: axllent/mailpit
    container_name: zaagl-mailpit
    ports:
      - "8025:8025" # web UI
      - "1025:1025" # SMTP
    networks:
      - backend
    profiles:
      - dev

networks:
  backend:
    driver: bridge

volumes:
  postgres-data:
  coordstate:
  storage:
  clamav-db:
